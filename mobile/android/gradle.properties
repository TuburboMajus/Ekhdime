# -Xmx8G here previously claimed nearly the entire Docker Desktop VM's own
# memory budget (~7.9GB, see the qemu -m flag on the host) by itself,
# before the JVM's own metaspace/code-cache/OS overhead on top -- reliably
# OOM-killed the Gradle daemon mid-build ("cannot allocate memory") once
# real resource/Kotlin compilation load hit. 3G leaves real headroom
# alongside Docker's own daemon and the NDK's native toolchain in the same
# VM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
